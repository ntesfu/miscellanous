<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1330" viewBox="0 0 1120 1330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#7b7f8a"/>
  </marker>
  <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#2f7d4f"/>
  </marker>
  <style>
    .t   { font-size:15px; font-weight:600; fill:#1c1e22; }
    .s   { font-size:11.5px; fill:#5b6068; }
    .lbl { font-size:10.5px; font-weight:700; letter-spacing:.6px; }
    .hdr { font-size:24px; font-weight:700; fill:#1c1e22; }
    .sub { font-size:13px; fill:#5b6068; font-style:italic; }
    .lat { font-size:11px; fill:#8a5a2b; font-weight:600; }
    .num { font-size:11.5px; fill:#1c1e22; }
    .cap { font-size:11px; font-weight:700; letter-spacing:.7px; fill:#8b8f98; }
  </style>
</defs>

<rect width="1120" height="1330" fill="#ffffff"/>

<text x="560" y="42" text-anchor="middle" class="hdr">Live Architecture — Assembly Copilot (streaming)</text>
<text x="560" y="66" text-anchor="middle" class="sub">Causal step head + procedure-aware online decode · every stage sees only the past</text>

<!-- ============ CAPTURE ============ -->
<rect x="40" y="92" width="700" height="132" rx="8" fill="none" stroke="#b9bec7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="52" y="112" class="cap">CAPTURE · on-device + network</text>

<rect x="70" y="122" width="300" height="56" rx="7" fill="#eef0f3" stroke="#b9bec7"/>
<text x="220" y="145" text-anchor="middle" class="t">HoloLens 2 — PV camera</text>
<text x="220" y="163" text-anchor="middle" class="s">1920×1080 @ 30 fps, egocentric</text>

<rect x="410" y="122" width="300" height="56" rx="7" fill="#eef0f3" stroke="#b9bec7"/>
<text x="560" y="145" text-anchor="middle" class="t">hl2ss stream over WiFi</text>
<text x="560" y="163" text-anchor="middle" class="s">same transport IndustReal used to record</text>
<line x1="370" y1="150" x2="405" y2="150" stroke="#7b7f8a" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="70" y="186" width="640" height="28" rx="6" fill="#f7f8fa" stroke="#d5d9df"/>
<text x="390" y="205" text-anchor="middle" class="s">rolling ring buffer · keeps only every 3rd frame, resized to 224² (the union any clip can need)</text>
<line x1="560" y1="178" x2="560" y2="184" stroke="#7b7f8a" stroke-width="1.6"/>

<line x1="390" y1="214" x2="390" y2="250" stroke="#7b7f8a" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ============ CLIP ============ -->
<rect x="190" y="252" width="400" height="52" rx="7" fill="#f7f8fa" stroke="#d5d9df"/>
<text x="390" y="273" text-anchor="middle" class="t">Clip assembly — 16 contiguous buffer entries</text>
<text x="390" y="291" text-anchor="middle" class="s">spans 48 source frames = 1.60 s of motion · one clip every 0.2 s</text>
<line x1="390" y1="304" x2="390" y2="336" stroke="#7b7f8a" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ============ ENCODERS ============ -->
<rect x="40" y="338" width="700" height="132" rx="8" fill="none" stroke="#5b7fc7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="52" y="358" class="cap" fill="#5b7fc7">FROZEN ENCODERS · reused unchanged from the offline system</text>

<rect x="70" y="368" width="300" height="62" rx="7" fill="#e4ebf8" stroke="#5b7fc7"/>
<text x="220" y="391" text-anchor="middle" class="t">VideoMAEv2-giant (SSv2)</text>
<text x="220" y="409" text-anchor="middle" class="s">motion / temporal dynamics · 1408-d</text>
<rect x="76" y="414" width="52" height="13" rx="3" fill="#5b7fc7"/>
<text x="102" y="424" text-anchor="middle" class="lbl" fill="#fff">frozen</text>

<rect x="410" y="368" width="300" height="62" rx="7" fill="#e4ebf8" stroke="#5b7fc7"/>
<text x="560" y="391" text-anchor="middle" class="t">InternVideo2-B14 (K710)</text>
<text x="560" y="409" text-anchor="middle" class="s">appearance / object semantics · 768-d</text>
<rect x="416" y="414" width="52" height="13" rx="3" fill="#5b7fc7"/>
<text x="442" y="424" text-anchor="middle" class="lbl" fill="#fff">frozen</text>

<text x="390" y="452" text-anchor="middle" class="s">one decode pass feeds both — the giant takes all 16 entries, B14 every 2nd</text>

<line x1="390" y1="470" x2="390" y2="498" stroke="#7b7f8a" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ============ FUSION ============ -->
<rect x="190" y="500" width="400" height="50" rx="7" fill="#eef0f3" stroke="#b9bec7"/>
<text x="390" y="521" text-anchor="middle" class="t">Feature fusion</text>
<text x="390" y="538" text-anchor="middle" class="s">L2-normalise each stream → concat = 2176-d · stateless, per-timestep</text>
<line x1="390" y1="550" x2="390" y2="582" stroke="#7b7f8a" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ============ CAUSAL HEAD ============ -->
<rect x="40" y="584" width="700" height="126" rx="8" fill="none" stroke="#d98a2b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="52" y="604" class="cap" fill="#d98a2b">TRAINED HEAD · replaces DiffAct, which cannot stream</text>

<rect x="90" y="614" width="600" height="84" rx="7" fill="#fbeedd" stroke="#d98a2b"/>
<text x="390" y="637" text-anchor="middle" class="t">Causal dilated TCN — 875 K params</text>
<text x="390" y="655" text-anchor="middle" class="s">left-padded convs only · per-timestep ChannelNorm · 9 layers, 128 maps</text>
<text x="390" y="672" text-anchor="middle" class="s">receptive field 1023 steps = 205 s of lookback · trained with T-MSE smoothing (λ=1.0)</text>
<text x="390" y="690" text-anchor="middle" class="s" fill="#2f7d4f">verified: output at t is bit-identical whether run on a prefix or the full sequence</text>
<rect x="96" y="619" width="40" height="13" rx="3" fill="#d98a2b"/>
<text x="116" y="629" text-anchor="middle" class="lbl" fill="#fff">NEW</text>

<line x1="390" y1="710" x2="390" y2="742" stroke="#7b7f8a" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ============ DECODE ============ -->
<rect x="40" y="744" width="700" height="170" rx="8" fill="none" stroke="#8465c4" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="52" y="764" class="cap" fill="#8465c4">ONLINE DECODE</text>

<rect x="90" y="774" width="600" height="76" rx="7" fill="#ece6f8" stroke="#8465c4"/>
<text x="390" y="797" text-anchor="middle" class="t">Causal Viterbi — procedure-aware</text>
<text x="390" y="815" text-anchor="middle" class="s">transition matrix learned from the 30 training recordings · self-bias 6.0</text>
<text x="390" y="833" text-anchor="middle" class="s">fixed-lag smoothing, lag = 10 steps (2.0 s): rejects illegal jumps instead of waiting them out</text>
<rect x="96" y="779" width="40" height="13" rx="3" fill="#8465c4"/>
<text x="116" y="789" text-anchor="middle" class="lbl" fill="#fff">NEW</text>

<rect x="90" y="862" width="600" height="42" rx="7" fill="#ece6f8" stroke="#8465c4"/>
<text x="390" y="880" text-anchor="middle" class="t">Completion-event emitter</text>
<text x="390" y="897" text-anchor="middle" class="s">fires once when the committed state leaves step k — never revised backwards</text>

<line x1="390" y1="914" x2="390" y2="946" stroke="#2f7d4f" stroke-width="1.8" marker-end="url(#arb)"/>

<!-- ============ OUTPUT ============ -->
<rect x="90" y="948" width="600" height="62" rx="7" fill="#e2f0e6" stroke="#2f7d4f"/>
<text x="390" y="971" text-anchor="middle" class="t">HUD notification → HoloLens</text>
<text x="390" y="989" text-anchor="middle" class="s">"Step 7 complete — Cowling Bracket" · advance instruction card</text>
<text x="390" y="1004" text-anchor="middle" class="s">WebSocket back to the headset</text>

<!-- ============ LATENCY RAIL ============ -->
<rect x="770" y="92" width="310" height="500" rx="8" fill="#fdf7ef" stroke="#e0c9a6"/>
<text x="790" y="118" class="t">Latency budget</text>
<text x="790" y="137" class="s">from step completion to notification</text>

<line x1="790" y1="150" x2="1060" y2="150" stroke="#e0c9a6"/>
<text x="790" y="174" class="num">clip must span 1.6 s of motion</text>
<text x="1050" y="174" text-anchor="end" class="lat">1.60 s</text>
<text x="790" y="192" class="s">irreducible — SSv2 needs seconds, not frames</text>

<text x="790" y="222" class="num">capture + WiFi + decode</text>
<text x="1050" y="222" text-anchor="end" class="lat">~0.10 s</text>

<text x="790" y="250" class="num">both encoders forward</text>
<text x="1050" y="250" text-anchor="end" class="lat">~0.17 s</text>

<text x="790" y="278" class="num">causal TCN + Viterbi lag</text>
<text x="1050" y="278" text-anchor="end" class="lat">2.00 s</text>
<text x="790" y="296" class="s">the one knob you can trade for accuracy</text>

<text x="790" y="324" class="num">WebSocket return</text>
<text x="1050" y="324" text-anchor="end" class="lat">~0.05 s</text>

<line x1="790" y1="340" x2="1060" y2="340" stroke="#e0c9a6"/>
<text x="790" y="364" class="t">total ≈ 3.9 s</text>

<line x1="790" y1="384" x2="1060" y2="384" stroke="#e0c9a6"/>
<text x="790" y="410" class="t">Throughput constraint</text>
<text x="790" y="432" class="num">encoders deliver</text>
<text x="1050" y="432" text-anchor="end" class="lat">6.0 clips/s</text>
<text x="790" y="454" class="num">real-time needs</text>
<text x="1050" y="454" text-anchor="end" class="lat">5.0 clips/s</text>
<text x="790" y="476" class="s">1.2× headroom on one RTX 4090 — one user,</text>
<text x="790" y="492" class="s">nothing spare. Batch size does not help;</text>
<text x="790" y="508" class="s">ViT-giant saturates the card.</text>
<text x="790" y="532" class="s">Options: B14-only path (~10× cheaper, loses</text>
<text x="790" y="548" class="s">the motion stream), stride 12, or a 2nd GPU.</text>

<!-- ============ RESULTS ============ -->
<rect x="770" y="608" width="310" height="402" rx="8" fill="#f4f7fa" stroke="#c8d2dd"/>
<text x="790" y="634" class="t">Measured — 10 held-out recordings</text>
<text x="790" y="653" class="s">identical scorer for both columns</text>

<text x="790" y="682" class="lbl" fill="#5b6068">METRIC</text>
<text x="960" y="682" text-anchor="middle" class="lbl" fill="#5b6068">LIVE</text>
<text x="1050" y="682" text-anchor="end" class="lbl" fill="#5b6068">OFFLINE</text>
<line x1="790" y1="690" x2="1060" y2="690" stroke="#c8d2dd"/>

<text x="790" y="714" class="num">frame accuracy</text>
<text x="960" y="714" text-anchor="middle" class="num" font-weight="700">94.15</text>
<text x="1050" y="714" text-anchor="end" class="num" fill="#8a8f98">96.24</text>

<text x="790" y="740" class="num">within ±2 s</text>
<text x="960" y="740" text-anchor="middle" class="num" font-weight="700">83.5%</text>
<text x="1050" y="740" text-anchor="end" class="num" fill="#8a8f98">87.2%</text>

<text x="790" y="766" class="num">completion median</text>
<text x="960" y="766" text-anchor="middle" class="num" font-weight="700">0.60 s</text>
<text x="1050" y="766" text-anchor="end" class="num" fill="#8a8f98">0.60 s</text>

<text x="790" y="792" class="num">F1@50</text>
<text x="960" y="792" text-anchor="middle" class="num">83.29</text>
<text x="1050" y="792" text-anchor="end" class="num" fill="#8a8f98">97.51</text>

<text x="790" y="818" class="num">F1@90</text>
<text x="960" y="818" text-anchor="middle" class="num">58.76</text>
<text x="1050" y="818" text-anchor="end" class="num" fill="#8a8f98">72.62</text>

<text x="790" y="844" class="num">segments (GT 110)</text>
<text x="960" y="844" text-anchor="middle" class="num">142</text>
<text x="1050" y="844" text-anchor="end" class="num" fill="#8a8f98">~124</text>

<line x1="790" y1="860" x2="1060" y2="860" stroke="#c8d2dd"/>
<text x="790" y="884" class="s">Frame accuracy is within 2 points and</text>
<text x="790" y="900" class="s">completion timing within 3.7 — on the metric</text>
<text x="790" y="916" class="s">a copilot is judged by, causal nearly matches</text>
<text x="790" y="932" class="s">a model that sees the future.</text>
<text x="790" y="956" class="s">The F1 gap is segment structure: the live head</text>
<text x="790" y="972" class="s">still over-segments 142 vs 110. That matters</text>
<text x="790" y="988" class="s">for a benchmark, far less for announcing</text>
<text x="790" y="1004" class="s">that a step just finished.</text>

<!-- ============ LEGEND ============ -->
<rect x="40" y="1032" width="1040" height="48" rx="6" fill="#f7f8fa" stroke="#d5d9df"/>
<rect x="60" y="1043" width="16" height="14" rx="3" fill="#e4ebf8" stroke="#5b7fc7"/><text x="84" y="1055" class="s">frozen</text>
<rect x="150" y="1043" width="16" height="14" rx="3" fill="#fbeedd" stroke="#d98a2b"/><text x="174" y="1055" class="s">trained</text>
<rect x="244" y="1043" width="16" height="14" rx="3" fill="#ece6f8" stroke="#8465c4"/><text x="268" y="1055" class="s">decode</text>
<rect x="338" y="1043" width="16" height="14" rx="3" fill="#e2f0e6" stroke="#2f7d4f"/><text x="362" y="1055" class="s">output</text>
<text x="440" y="1050" class="s">Unchanged from offline: capture format, both frozen encoders, fusion.</text>
<text x="440" y="1068" class="s">Replaced: DiffAct → causal TCN.   New: ring buffer, causal Viterbi, completion-event emitter.</text>

<!-- ============ FOOTER ============ -->
<rect x="40" y="1080" width="1040" height="222" rx="8" fill="#fbfbfc" stroke="#e3e6ea"/>
<text x="60" y="1106" class="t">Why each piece is shaped this way</text>

<text x="60" y="1132" class="num" font-weight="700">DiffAct could not be reused.</text>
<text x="60" y="1150" class="s">It is a diffusion model with bidirectional temporal convolutions over the whole sequence — it does not merely benefit from future frames, it requires them.</text>
<text x="60" y="1166" class="s">There is no prefix mode. Its 96.24 describes a system that had already watched the recording to the end.</text>

<text x="60" y="1192" class="num" font-weight="700">Causality is verified, not assumed.</text>
<text x="60" y="1210" class="s">The first implementation used GroupNorm, which normalises over channels × time — every timestep silently depended on the entire sequence. It trains fine and</text>
<text x="60" y="1226" class="s">scores well; only an explicit test catches it. A perturbation check runs before every training job and aborts on any leakage.</text>

<text x="60" y="1252" class="num" font-weight="700">Flicker was a training problem, not a decoding one.</text>
<text x="60" y="1270" class="s">Cross-entropy scores each frame independently, so nothing penalised jitter: the first causal head emitted 432 segments where there are 110. Adding MS-TCN's</text>
<text x="60" y="1286" class="s">truncated-MSE term took raw-argmax F1@50 from 43.6 to 67.6 before any decoder ran. Viterbi then rejects procedure-illegal transitions at zero latency cost.</text>
</svg>
